<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Install Anyshift Backstage plugins so service pages show live dependencies, monitors, changes, and blast radius">
  <title>Backstage service page with Anyshift production context</title>
  <rect x="0" y="0" width="600" height="200" fill="#F5F2EC"/>

  <!-- Backstage shell -->
  <rect x="28" y="24" width="544" height="152" fill="#ffffff" stroke="#E0D7C7" stroke-width="1.5"/>
  <rect x="28" y="24" width="120" height="152" fill="#1b2b41"/>
  <text x="48" y="52" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#7ec8d8" font-weight="700">Backstage</text>
  <rect x="44" y="68" width="88" height="10" fill="#0A8F9E" opacity="0.35"/>
  <text x="48" y="90" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#d6c7b1">Catalog</text>
  <text x="48" y="110" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#f5f1e8">checkout-api</text>
  <text x="48" y="130" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E">APIs</text>
  <text x="48" y="150" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E">Docs</text>

  <!-- service header -->
  <text x="168" y="52" font-family="DM Sans, Arial, sans-serif" font-size="16" fill="#1b2b41" font-weight="700">checkout-api</text>
  <rect x="300" y="38" width="64" height="18" fill="#7ec8d8"/>
  <text x="332" y="51" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#1b2b41" text-anchor="middle" font-weight="700">SERVICE</text>

  <!-- Anyshift panel chips -->
  <rect x="168" y="72" width="118" height="40" fill="#FAF8F3" stroke="#E0D7C7" stroke-width="1"/>
  <text x="178" y="90" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E">Dependencies</text>
  <text x="178" y="106" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#1b2b41" font-weight="700">8 live</text>

  <rect x="298" y="72" width="118" height="40" fill="#FAF8F3" stroke="#E0D7C7" stroke-width="1"/>
  <text x="308" y="90" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E">Monitors</text>
  <text x="308" y="106" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#1b2b41" font-weight="700">12 linked</text>

  <rect x="428" y="72" width="118" height="40" fill="#FAF8F3" stroke="#E0D7C7" stroke-width="1"/>
  <text x="438" y="90" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E">Changes</text>
  <text x="438" y="106" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#1b2b41" font-weight="700">3 today</text>

  <!-- blast radius bar -->
  <rect x="168" y="126" width="378" height="36" fill="#1b2b41"/>
  <circle cx="188" cy="144" r="8" fill="#e07a5f"/>
  <text x="208" y="149" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#f5f1e8" font-weight="700">Blast radius from Graph API</text>
  <text x="520" y="149" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#7ec8d8" text-anchor="end">beta</text>
</svg>
