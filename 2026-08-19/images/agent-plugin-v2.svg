  <circle cx="62" cy="48" r="4" fill="#d6c7b1"/>
  <circle cx="76" cy="48" r="4" fill="#7ec8d8"/>
  <text x="44" y="78" font-family="Fira Code, Menlo, monospace" font-size="12" fill="#7ec8d8">agent-plugin</text>
  <text x="44" y="100" font-family="Fira Code, Menlo, monospace" font-size="12" fill="#f5f1e8">resolve_resource</text>
