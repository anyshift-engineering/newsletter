  <text x="478" y="110" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41">12 in blast radius</text>
  <text x="478" y="128" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41">what changed</text>
