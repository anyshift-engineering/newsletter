  <rect x="384" y="36" width="188" height="26" fill="#1b2b41"/>
  <text x="478" y="54" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#7ec8d8" text-anchor="middle" font-weight="700">graph evidence</text>

  <path d="M412 86 L448 86" fill="none" stroke="#0A8F9E" stroke-width="2.5" stroke-linecap="butt"/>
  <path d="M412 86 L430 114" fill="none" stroke="#0A8F9E" stroke-width="2.5" stroke-linecap="butt"/>
