  <rect x="24" y="24" width="268" height="152" fill="#1b2b41"/>
  <circle cx="44" cy="44" r="4" fill="#e07a5f"/>
  <circle cx="58" cy="44" r="4" fill="#d6c7b1"/>
  <circle cx="72" cy="44" r="4" fill="#7ec8d8"/>
  <text x="44" y="72" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#7ec8d8" font-weight="700">agent-plugin</text>
  <text x="44" y="96" font-family="Fira Code, Menlo, monospace" font-size="11" fill="#f5f1e8">resolve_resource</text>
  <text x="44" y="114" font-family="Fira Code, Menlo, monospace" font-size="11" fill="#f5f1e8">get_blast_radius</text>
  <text x="44" y="132" font-family="Fira Code, Menlo, monospace" font-size="11" fill="#f5f1e8">get_recent_changes</text>
