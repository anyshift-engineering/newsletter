<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Install the Anyshift agent plugin so Cursor, Codex, VS Code, or Claude Code query the production graph over Graph MCP">
