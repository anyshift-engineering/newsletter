  <path d="M300 100 H348" fill="none" stroke="#0A8F9E" stroke-width="2"/>
  <polyline points="340,94 348,100 340,106" fill="none" stroke="#0A8F9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="356" y="24" width="220" height="152" fill="#f5f1e8" stroke="#1b2b41" stroke-width="1.5"/>
  <rect x="356" y="24" width="220" height="26" fill="#1b2b41"/>
  <text x="466" y="42" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#7ec8d8" text-anchor="middle" font-weight="700">graph evidence</text>

  <rect x="376" y="64" width="40" height="40" fill="#1b2b41"/>
  <path d="M386 78 L396 78" fill="none" stroke="#7ec8d8" stroke-width="2.5" stroke-linecap="butt"/>
