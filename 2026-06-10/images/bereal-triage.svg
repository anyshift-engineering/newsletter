<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="A Go panic read against BeReal's maintained graph resolves to a cache miss in one domain and routes to its owner in about thirty seconds">
  <title>A Go panic routed to the right domain owner in about thirty seconds</title>
  <rect x="0" y="0" width="600" height="200" fill="#F5F2EC"/>

  <!-- beat 1: panic / stack trace -->
  <rect x="24" y="68" width="132" height="66" rx="8" fill="#1b2b41"/>
  <polygon points="44,80 55,99 33,99" fill="#e07a5f"/>
  <rect x="41" y="86" width="3" height="7" rx="1.5" fill="#1b2b41"/>
  <rect x="41" y="95" width="3" height="3" rx="1.5" fill="#1b2b41"/>
  <rect x="66" y="84" width="74" height="5" rx="2.5" fill="#f5f1e8" opacity="0.85"/>
  <rect x="66" y="96" width="58" height="5" rx="2.5" fill="#f5f1e8" opacity="0.6"/>
  <rect x="66" y="108" width="66" height="5" rx="2.5" fill="#f5f1e8" opacity="0.6"/>
  <text x="90" y="152" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#1b2b41" text-anchor="middle">panic</text>

  <!-- arrow 1 -->
  <path d="M162 101 H206" fill="none" stroke="#0A8F9E" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- beat 2: Annie mark + graph, one node highlighted -->
  <rect x="220" y="79" width="44" height="44" rx="10" fill="#1b2b41"/>
  <polyline points="234,90 245,101 234,112" fill="none" stroke="#7ec8d8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="243,90 254,101 243,112" fill="none" stroke="#7ec8d8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="264" y1="101" x2="300" y2="72" stroke="#1b2b41" stroke-width="1.5"/>
  <line x1="264" y1="101" x2="300" y2="132" stroke="#1b2b41" stroke-width="1.5"/>
  <line x1="300" y1="72" x2="344" y2="100" stroke="#1b2b41" stroke-width="1.5"/>
  <line x1="300" y1="132" x2="344" y2="100" stroke="#1b2b41" stroke-width="1.5"/>
  <line x1="300" y1="72" x2="352" y2="62" stroke="#1b2b41" stroke-width="1.5"/>
  <circle cx="300" cy="72" r="10" fill="#f5f1e8" stroke="#1b2b41" stroke-width="1.5"/>
  <circle cx="300" cy="132" r="10" fill="#f5f1e8" stroke="#1b2b41" stroke-width="1.5"/>
  <circle cx="356" cy="60" r="8" fill="#f5f1e8" stroke="#1b2b41" stroke-width="1.5"/>
  <circle cx="344" cy="100" r="12" fill="#7ec8d8"/>
  <text x="344" y="142" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">domain X</text>

  <!-- arrow 2 -->
  <path d="M362 100 H414" fill="none" stroke="#0A8F9E" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- beat 3: owner + ~30s -->
  <circle cx="470" cy="80" r="14" fill="#1b2b41"/>
  <path d="M446 132 C446 104 494 104 494 132 Z" fill="#1b2b41"/>
  <text x="470" y="152" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#1b2b41" text-anchor="middle">owner</text>
  <rect x="510" y="86" width="66" height="26" rx="13" fill="#7ec8d8"/>
  <text x="543" y="104" font-family="DM Sans, Arial, sans-serif" font-size="14" fill="#1b2b41" text-anchor="middle" font-weight="700">~30s</text>
</svg>
