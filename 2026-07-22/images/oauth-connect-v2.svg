<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Connect with Atlassian, Linear, GitLab, Notion, Sentry, and incident.io via OAuth, with personal tokens as the fallback">
  <title>OAuth connect replaces pasted API tokens for the common path</title>
  <rect x="0" y="0" width="600" height="200" fill="#F5F2EC"/>

  <!-- left: old path crossed out -->
  <rect x="28" y="48" width="168" height="104" fill="#f5f1e8" stroke="#9C958E" stroke-width="1.5"/>
  <text x="112" y="78" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#9C958E" text-anchor="middle" letter-spacing="0.5">API TOKEN</text>
  <rect x="48" y="92" width="128" height="28" fill="#ffffff" stroke="#d6c7b1" stroke-width="1"/>
  <text x="112" y="110" font-family="Fira Code, Menlo, monospace" font-size="12" fill="#9C958E" text-anchor="middle">**********</text>
  <path d="M40 56 L184 144" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="112" y="168" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E" text-anchor="middle">paste path</text>

  <!-- arrow to new path -->
  <path d="M214 100 H268" fill="none" stroke="#0A8F9E" stroke-width="2"/>
  <polyline points="260,94 268,100 260,106" fill="none" stroke="#0A8F9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- center: OAuth button; check optically centered in the cyan circle -->
  <rect x="280" y="72" width="160" height="56" fill="#1b2b41"/>
  <circle cx="308" cy="100" r="12" fill="#7ec8d8"/>
  <polyline points="301.5,100.5 305.5,105 315,94.5" fill="none" stroke="#1b2b41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="328" y="96" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#f5f1e8" font-weight="700">Connect with</text>
  <text x="328" y="114" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#7ec8d8" font-weight="700">OAuth</text>
  <text x="360" y="152" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#1b2b41" text-anchor="middle" letter-spacing="0.5">backend-owned refresh</text>

  <!-- right: one chip per provider -->
  <rect x="468" y="28" width="104" height="22" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="43" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Atlassian</text>
  <rect x="468" y="54" width="104" height="22" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="69" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Linear</text>
  <rect x="468" y="80" width="104" height="22" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="95" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">GitLab</text>
  <rect x="468" y="106" width="104" height="22" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="121" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Notion</text>
  <rect x="468" y="132" width="104" height="22" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="147" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Sentry</text>
  <rect x="468" y="158" width="104" height="22" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="173" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">incident.io</text>
</svg>
