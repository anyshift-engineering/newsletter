<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="One click to connect Atlassian, Linear, GitLab, Notion, Sentry, and incident.io with OAuth instead of pasting an API token">
  <title>One click OAuth connect replaces pasted API tokens</title>
  <rect x="0" y="0" width="600" height="200" fill="#F5F2EC"/>

  <!-- left: old path crossed out -->
  <rect x="28" y="48" width="168" height="104" fill="#f5f1e8" stroke="#9C958E" stroke-width="1.5"/>
  <text x="112" y="78" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#9C958E" text-anchor="middle" letter-spacing="0.5">API TOKEN</text>
  <rect x="48" y="92" width="128" height="28" fill="#ffffff" stroke="#d6c7b1" stroke-width="1"/>
  <text x="112" y="110" font-family="Fira Code, Menlo, monospace" font-size="12" fill="#9C958E" text-anchor="middle">**********</text>
  <path d="M40 56 L184 144" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="112" y="168" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E" text-anchor="middle">paste path</text>

  <!-- arrow to new path -->
  <path d="M214 100 H268" fill="none" stroke="#0A8F9E" stroke-width="2"/>
  <polyline points="260,94 268,100 260,106" fill="none" stroke="#0A8F9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ONE CLICK badge above the button -->
  <rect x="310" y="38" width="100" height="24" fill="#E07A5F"/>
  <text x="360" y="54" font-family="DM Sans, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" letter-spacing="0.12em">1 CLICK</text>

  <!-- center: OAuth button -->
  <rect x="280" y="72" width="160" height="56" fill="#1b2b41"/>
  <circle cx="310" cy="100" r="12" fill="#7ec8d8"/>
  <polyline points="303.5,102.5 308.5,107.5 317.5,97" fill="none" stroke="#1b2b41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="94" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#f5f1e8" font-weight="700">Connect with</text>
  <text x="330" y="112" font-family="DM Sans, Arial, sans-serif" font-size="13" fill="#7ec8d8" font-weight="700">OAuth</text>

  <!-- cursor clicking the button (bottom-right of button) -->
  <g transform="translate(402, 112)">
    <!-- pointer body -->
    <path d="M0,0 L0,22 L6,17 L10,26 L14,24 L10,15 L18,15 Z" fill="#09090b" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <text x="360" y="158" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle" font-weight="700">one click to connect</text>
  <text x="360" y="174" font-family="DM Sans, Arial, sans-serif" font-size="10" fill="#9C958E" text-anchor="middle">no token to paste</text>

  <!-- right: one chip per provider -->
  <rect x="468" y="22" width="104" height="20" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="36" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Atlassian</text>

  <rect x="468" y="48" width="104" height="20" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="62" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Linear</text>

  <rect x="468" y="74" width="104" height="20" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="88" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">GitLab</text>

  <rect x="468" y="100" width="104" height="20" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="114" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Notion</text>

  <rect x="468" y="126" width="104" height="20" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="140" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">Sentry</text>

  <rect x="468" y="152" width="104" height="20" fill="#ffffff" stroke="#E0D7C7" stroke-width="1"/>
  <text x="520" y="166" font-family="DM Sans, Arial, sans-serif" font-size="11" fill="#1b2b41" text-anchor="middle">incident.io</text>
</svg>
